backend:
  name: github
  repo: WithMilkFilms/amara-moon
  branch: main
  base_url: https://amara-moon.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page Sections"
        file: "content/home.json"
        fields:
          - name: "hero"
            label: "Hero"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "text"}
          - name: "invitation"
            label: "The Invitation Section"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Pull-quote", name: "quote", widget: "text"}
              - name: "paragraphs"
                label: "Paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
          - name: "legend"
            label: "Legend Section (page closing note)"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Paragraph", name: "paragraph", widget: "text"}
              - {label: "Closing quote", name: "closingQuote", widget: "text"}
          - name: "teachInvitation"
            label: "Teach Invitation Section"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Paragraph", name: "paragraph", widget: "text"}

  - name: "facilities"
    label: "Facilities (The Grounds)"
    files:
      - name: "facilities"
        label: "Facilities"
        file: "content/facilities.json"
        fields:
          - name: "heading"
            label: "Section Heading"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
          - name: "groups"
            label: "Facility Groups"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "select", options: ["trees", "waves", "flame"]}
              - {label: "Group title", name: "title", widget: "string"}
              - name: "items"
                label: "Items"
                widget: "list"
                field: {label: "Item", name: "item", widget: "string"}

  - name: "pages"
    label: "Page Headers & Copy"
    files:
      - name: "pages"
        label: "Offerings, Schedule, Gallery, Work with Us, Contact"
        file: "content/pages.json"
        fields:
          - name: "offerings"
            label: "Offerings Page"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
          - name: "schedule"
            label: "Schedule Page"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Note (about times TBA)", name: "note", widget: "text"}
              - {label: "Booking section heading", name: "bookingHeading", widget: "string"}
              - {label: "Booking section body", name: "bookingBody", widget: "text"}
          - name: "gallery"
            label: "Gallery Page"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Closing line", name: "closingLine", widget: "string"}
          - name: "workWithUs"
            label: "Work with Us Page"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "\"Introduce yourself\" heading", name: "introduceHeading", widget: "string"}
              - {label: "\"Introduce yourself\" body", name: "introduceBody", widget: "text"}
              - name: "lookingFor"
                label: "Who We Look For"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
          - name: "contact"
            label: "Contact Page"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Getting here paragraph", name: "gettingHere", widget: "text"}

  - name: "offerings"
    label: "Offerings"
    files:
      - name: "offerings"
        label: "Offerings List"
        file: "content/offerings.json"
        fields:
          - name: "offerings"
            label: "Offerings"
            widget: "list"
            fields:
              - {label: "Slug", name: "slug", widget: "string", hint: "Must match the URL, don't change unless you mean to break links"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Kind", name: "kind", widget: "select", options: ["session", "studio_hire"]}
              - {label: "Unit", name: "unit", widget: "string", hint: "e.g. 'per session', 'per hour'"}
              - {label: "Price (ZAR cents)", name: "priceInCents", widget: "number", hint: "R250.00 = 25000"}
              - {label: "Needs Price (shows Enquire instead of Pay)", name: "needsPrice", widget: "boolean"}
              - {label: "Duration (minutes)", name: "durationMinutes", widget: "number"}
              - {label: "Max Quantity", name: "maxQuantity", widget: "number"}
              - {label: "Summary", name: "summary", widget: "text"}
              - name: "description"
                label: "Description"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - {label: "Image", name: "image", widget: "image", choose_url: false}

  - name: "cabin"
    label: "Pine Forest Cabin"
    files:
      - name: "cabin"
        label: "Cabin"
        file: "content/cabin.json"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Max Guests", name: "maxGuests", widget: "number"}
          - {label: "Price per Night (ZAR cents)", name: "pricePerNightInCents", widget: "number"}
          - {label: "Needs Price (placeholder)", name: "needsPrice", widget: "boolean"}
          - {label: "Min Nights", name: "minNights", widget: "number"}
          - {label: "Max Nights", name: "maxNights", widget: "number"}
          - {label: "Summary", name: "summary", widget: "text"}
          - name: "description"
            label: "Description"
            widget: "list"
            field: {label: "Paragraph", name: "paragraph", widget: "text"}
          - name: "amenities"
            label: "Amenities"
            widget: "list"
            field: {label: "Amenity", name: "amenity", widget: "string"}
          - {label: "Image", name: "image", widget: "image", choose_url: false}
          - name: "photos"
            label: "Photo Gallery"
            widget: "list"
            fields:
              - {label: "Photo", name: "src", widget: "image", choose_url: false}
              - {label: "Alt Text", name: "alt", widget: "string"}

  - name: "schedule"
    label: "Weekly Schedule"
    files:
      - name: "schedule"
        label: "Schedule & Programme"
        file: "content/schedule.json"
        fields:
          - name: "schedule"
            label: "Weekly Class Times"
            widget: "list"
            hint: "Leave empty until real class times are confirmed. Each entry needs a day, time and duration."
            fields:
              - {label: "Day", name: "day", widget: "select", options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]}
              - {label: "Time (24h, e.g. 09:00)", name: "time", widget: "string"}
              - {label: "Duration (minutes)", name: "durationMinutes", widget: "number"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Teacher", name: "teacher", widget: "string"}
              - {label: "Offering Slug", name: "offeringSlug", widget: "string", hint: "Must match a slug in the Offerings collection so this links through to booking"}
              - {label: "Note", name: "note", widget: "string", required: false}
          - name: "programme"
            label: "What Runs Here (Programme)"
            widget: "list"
            hint: "The practices on offer, shown while the weekly timetable is empty or alongside it"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Blurb", name: "blurb", widget: "text"}
              - {label: "Offering Slug", name: "offeringSlug", widget: "string", required: false, hint: "Optional — leave blank if this practice has no bookable page yet"}

  - name: "site"
    label: "Site & Contact"
    files:
      - name: "site"
        label: "Contact Details"
        file: "content/site.json"
        fields:
          - {label: "Business Name", name: "name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - name: "address"
            label: "Address"
            widget: "object"
            fields:
              - {label: "Line 1", name: "line1", widget: "string"}
              - {label: "Line 2", name: "line2", widget: "string"}
              - {label: "City", name: "city", widget: "string"}
              - {label: "Country", name: "country", widget: "string"}
          - name: "geo"
            label: "Map Coordinates"
            widget: "object"
            fields:
              - {label: "Latitude", name: "latitude", widget: "number", value_type: "float"}
              - {label: "Longitude", name: "longitude", widget: "number", value_type: "float"}
          - {label: "Phone", name: "phone", widget: "string", hint: "Include country code, e.g. +27 71 686 97 32"}
          - {label: "Email", name: "email", widget: "string"}
          - name: "socials"
            label: "Social Media"
            widget: "object"
            fields:
              - {label: "Instagram Handle", name: "instagramHandle", widget: "string"}
              - {label: "Instagram URL", name: "instagram", widget: "string"}
              - {label: "Facebook URL", name: "facebook", widget: "string"}
          - name: "proximity"
            label: "Proximity Lines"
            widget: "object"
            fields:
              - {label: "Beach", name: "beach", widget: "string"}
              - {label: "Trails", name: "trails", widget: "string"}

  - name: "shop"
    label: "Shop"
    files:
      - name: "shop"
        label: "Shop Products"
        file: "content/shop.json"
        fields:
          - {label: "Shop Note", name: "note", widget: "text"}
          - name: "products"
            label: "Products"
            widget: "list"
            fields:
              - {label: "Slug", name: "slug", widget: "string", hint: "Must match the URL, do not change unless you mean to break links"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Price (ZAR)", name: "price", widget: "number"}
              - {label: "Image", name: "image", widget: "image", choose_url: false}
              - {label: "Turnaround", name: "turnaroundDays", widget: "string"}
